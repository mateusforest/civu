&lt;section data-view=&quot;governanca&quot; hidden&gt;&lt;div class=&quot;el-kicker&quot;&gt;Autonomia municipal&lt;/div&gt;&lt;h2&gt;A gestão mantém o controle.&lt;/h2&gt;&lt;p class=&quot;el-subtitle&quot;&gt;Permissões, configurações, integrações e histórico sob governança institucional.&lt;/p&gt;&lt;div class=&quot;el-two equal&quot;&gt;&lt;div class=&quot;el-panel&quot;&gt;&lt;h3&gt;Acesso por responsabilidade&lt;/h3&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Prefeito e gabinete&lt;/strong&gt;&lt;p&gt;Metas, resultados e encaminhamentos de gestão.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Secretarias e coordenações&lt;/strong&gt;&lt;p&gt;Programação e decisões dentro de suas atribuições.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Controle interno&lt;/strong&gt;&lt;p&gt;Trilhas de decisão, alterações e evidências.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Dados restritos&lt;/strong&gt;&lt;p&gt;Acesso específico, com registro de consulta e finalidade.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;el-panel&quot;&gt;&lt;h3&gt;Continuidade e qualidade&lt;/h3&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Integrações supervisionadas&lt;/strong&gt;&lt;p&gt;Origem, última atualização, falhas e conciliação.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Regras versionadas&lt;/strong&gt;&lt;p&gt;Alteração, justificativa, aprovação e vigência.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Dados portáveis&lt;/strong&gt;&lt;p&gt;Exportação documentada e plano de transição.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;Recuperação e auditoria&lt;/strong&gt;&lt;p&gt;Cópias verificadas e histórico preservado.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;el-panel el-mt&quot;&gt;&lt;h3&gt;Áreas setoriais conectadas&lt;/h3&gt;&lt;p class=&quot;el-small el-mt&quot;&gt;Saúde, educação, assistência, agricultura e cultura: indicadores e encaminhamentos conforme cada política. Sistemas especializados preservam seus registros oficiais e permissões.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section data-view=&quot;helpu&quot; hidden&gt;&lt;div class=&quot;el-kicker&quot;&gt;Desenvolvimento econômico / módulo complementar&lt;/div&gt;&lt;h2&gt;HelpU e o negócio local.&lt;/h2&gt;&lt;p class=&quot;el-subtitle&quot;&gt;Adesão de empresas e simulação da parceria com o município.&lt;/p&gt;&lt;div class=&quot;el-two equal&quot;&gt;&lt;div class=&quot;el-panel&quot;&gt;&lt;h3&gt;Jornada de participação&lt;/h3&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;1. Programa municipal&lt;/strong&gt;&lt;p&gt;Divulgação e convite pelos canais autorizados.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;2. Adesão da empresa&lt;/strong&gt;&lt;p&gt;Cadastro voluntário e confirmação das informações.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;3. Assinatura HelpU&lt;/strong&gt;&lt;p&gt;Vitrine, serviços, produtos e oportunidades locais.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;strong&gt;4. Prestação de contas da parceria&lt;/strong&gt;&lt;p&gt;Base elegível, recebimentos, cancelamentos e repasse apurado.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;el-sectionline&quot;&gt;&lt;span class=&quot;el-pill amber&quot;&gt;Parceria em estudo&lt;/span&gt;&lt;p class=&quot;el-small el-mt&quot;&gt;Compartilhamento de dados e repasse dependem de enquadramento jurídico e instrumento formal. Sem importação automática da base fiscal.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;el-panel&quot;&gt;&lt;div class=&quot;el-row&quot;&gt;&lt;h3&gt;Simulação de recorrência&lt;/h3&gt;&lt;span class=&quot;el-pill&quot;&gt;Hipóteses editáveis&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;el-form el-mt&quot;&gt;&lt;label class=&quot;el-field&quot;&gt;Assinaturas ativas&lt;input id=&quot;el-h-count&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100000&quot; value=&quot;200&quot;&gt;&lt;/label&gt;&lt;label class=&quot;el-field&quot;&gt;Mensalidade média (R$)&lt;input id=&quot;el-h-tick   function revenue(api){const m=totals(api);return &#x27;&lt;div class=&quot;fc-grid&quot;&gt;&#x27;+metric(api,&#x27;Tributos conciliados na origem&#x27;,m.confirmedIncome,&#x27;Confirmações vindas do módulo tributário.&#x27;)+metric(api,&#x27;Receita integrada ao financeiro&#x27;,m.postedIncome,&#x27;Créditos registrados na fonte municipal.&#x27;)+metric(api,&#x27;Pendente de integração&#x27;,m.pendingIncome,&#x27;Conciliação financeira a completar.&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;fc-flow-card el-mt&quot;&gt;&lt;h3&gt;Guias e origem da arrecadação&lt;/h3&gt;&lt;table class=&quot;el-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Origem&lt;/th&gt;&lt;th&gt;Valor&lt;/th&gt;&lt;th&gt;Situação tributária&lt;/th&gt;&lt;th&gt;Registro financeiro&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+receiptRows(api)+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;importRevenue&#x27;,&#x27;Integrar receitas conciliadas&#x27;,{primary:true,disabled:!m.pendingIncome||api.state.role!==&#x27;Tesouraria&#x27;})+api.button(&#x27;checkRevenue&#x27;,&#x27;Conferir importação duplicada&#x27;)+api.jumpAdmin(&#x27;tributacao&#x27;,&#x27;Conferir guias e retornos&#x27;)+&#x27;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;O informe do contribuinte não gera receita no caixa. Cada retorno conciliado entra uma única vez. Se a integração automática estiver desligada, permanece pendente até a ação da Tesouraria.&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;fc-detail&quot;&gt;&lt;summary&gt;Projeção do recorte e limites&lt;/summary&gt;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;div class=&quot;ep-ledger&quot;&gt;&lt;div&gt;&lt;span&gt;Tributos ainda não confirmados&lt;/span&gt;&lt;strong&gt;&#x27;+api.money(2000-m.confirmedIncome)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Parcela de convênio prevista&lt;/span&gt;&lt;strong&gt;&#x27;+api.money(api.state.grant?0:50000)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;Entradas previstas são hipóteses, sem garantia de recebimento. Não liberam saldo para pagamento. Vinculações constitucionais, deduções e contabilização completa dependem do sistema oficial; este é um recorte didático.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&#x27;;}
  function cash(api){const m=totals(api),f=api.state;return &#x27;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;h3&gt;Caixa por fonte · saldo e compromissos&lt;/h3&gt;&lt;table class=&quot;el-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Fonte&lt;/th&gt;&lt;th&gt;Saldo contábil&lt;/th&gt;&lt;th&gt;Programado / separado&lt;/th&gt;&lt;th&gt;Disponível no recorte&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+Object.entries(funds).map(([id,title])=&gt;&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+title+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+api.money(m.balances[id])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+api.money(id===&#x27;convenio&#x27;?m.held:id===&#x27;proprios&#x27;?m.maintenanceHeld:0)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+api.money(m.available[id])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;fc-status&quot;&gt;A praça utiliza a fonte do convênio. O saldo vinculado à saúde não está disponível para essa obra.&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;Saldo do exemplo considera somente os eventos demonstrados. Dotação orçamentária, valores a receber e valores programados não são depósitos bancários.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fc-grid two&quot;&gt;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;h3&gt;Parcela prevista do convênio&lt;/h3&gt;&lt;p class=&quot;fc-note&quot;&gt;Crédito esperado: R$ 50.000 · referência DEMO-CONV-004. Origem e vinculação previamente definidas no exemplo.&lt;/p&gt;&#x27;+(f.grant?&#x27;&lt;div class=&quot;fc-status&quot;&gt;Parcela confirmada e conciliada: R$ 50.000 na fonte da praça.&lt;/div&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;receiveGrant&#x27;,&#x27;Testar retorno repetido&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&lt;label class=&quot;el-field el-mt&quot;&gt;Retorno de crédito&lt;select data-mx-change=&quot;finance:grantBank&quot;&gt;&lt;option value=&quot;correto&quot; &#x27;+(f.grantBank===&#x27;correto&#x27;?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;Referência e valor corretos&lt;/option&gt;&lt;option value=&quot;divergente&quot; &#x27;+(f.grantBank===&#x27;divergente&#x27;?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;Referência divergente&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&#x27;+(!f.autoMatch?check(api,&#x27;grantManual&#x27;,&#x27;Conferir manualmente o retorno de crédito&#x27;,f.grantManual):&#x27;&#x27;)+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;receiveGrant&#x27;,&#x27;Simular recebimento e conciliação&#x27;,{primary:true,disabled:f.role!==&#x27;Tesouraria&#x27;||(!f.autoMatch&amp;&amp;!f.grantManual)})+&#x27;&lt;/div&gt;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;h3&gt;Programação e alerta de caixa&lt;/h3&gt;&lt;p class=&quot;fc-note&quot;&gt;Liquidações da obra ainda não pagas: &#x27;+api.money(m.liquidated-m.workPaid)+&#x27;. Disponível para nova programação: &#x27;+api.money(m.available.convenio)+&#x27;.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;forecast&#x27;,&#x27;Verificar necessidade de caixa&#x27;)+jump(api,&#x27;pagamentos&#x27;,&#x27;Abrir programação&#x27;)+&#x27;&lt;/div&gt;&#x27;+(f.flowAlert?&#x27;&lt;div class=&quot;fc-status&quot;&gt;Há despesa liquidada sem cobertura suficiente para uma nova programação. Verifique a entrada prevista; ela ainda não compõe o saldo.&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;fc-detail&quot;&gt;&lt;summary&gt;Movimentação rastreável do recorte&lt;/summary&gt;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;table class=&quot;el-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Evento&lt;/th&gt;&lt;th&gt;Fonte&lt;/th&gt;&lt;th&gt;Entrada&lt;/th&gt;&lt;th&gt;Saída&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+(f.receipts.iptu?&#x27;&lt;tr&gt;&lt;td&gt;RET-DEMO-IPTU-021&lt;/td&gt;&lt;td&gt;Municipais&lt;/td&gt;&lt;td&gt;R$ 1.200,00&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&#x27;:&#x27;&#x27;)+(f.receipts.iss?&#x27;&lt;tr&gt;&lt;td&gt;RET-DEMO-ISS-032&lt;/td&gt;&lt;td&gt;Municipais&lt;/td&gt;&lt;td&gt;R$ 800,00&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&#x27;:&#x27;&#x27;)+(f.grant?&#x27;&lt;tr&gt;&lt;td&gt;RET-DEMO-CONV-004&lt;/td&gt;&lt;td&gt;Praça&lt;/td&gt;&lt;td&gt;R$ 50.000,00&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&#x27;:&#x27;&#x27;)+f.items.map((x,i)=&gt;x.stage===5?&#x27;&lt;tr&gt;&lt;td&gt;DEMO-PAG-0&#x27;+(i+1)+&#x27;&lt;/td&gt;&lt;td&gt;Praça&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;R$ 60.000,00&lt;/td&gt;&lt;/tr&gt;&#x27;:&#x27;&#x27;).join(&#x27;&#x27;)+(m.maintenancePaid?&#x27;&lt;tr&gt;&lt;td&gt;DEMO-RET-003 · manutenção&lt;/td&gt;&lt;td&gt;Municipais&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;R$ 8.000,00&lt;/td&gt;&lt;/tr&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;fc-note&quot;&gt;Retornos identificados evitam duplicidade. Saldo inicial: R$ 320.000 no recorte, segregado por fonte.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&#x27;;}
  function payments(api){const f=api.state,m=totals(api),p=f.items[f.selected],i=f.selected;
    let h=&#x27;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;div class=&quot;fc-row&quot;&gt;&lt;h3&gt;Recebíveis da obra · Empresa Alfa&lt;/h3&gt;&lt;span class=&quot;el-pill&quot;&gt;DEMO-CT-OB-004&lt;/span&gt;&lt;/div&gt;&lt;table class=&quot;el-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Medição&lt;/th&gt;&lt;th&gt;Valor&lt;/th&gt;&lt;th&gt;Fiscalização&lt;/th&gt;&lt;th&gt;Financeiro&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+f.items.map((x,j)=&gt;&#x27;&lt;tr&gt;&lt;td&gt;DEMO-MED-0&#x27;+(j+1)+&#x27;&lt;/td&gt;&lt;td&gt;R$ 60.000,00&lt;/td&gt;&lt;td&gt;&#x27;+(approved(api,j)?&#x27;Aprovada&#x27;:&#x27;Aguardando aprovação&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(!x.queued?&#x27;Não importada&#x27;:labels[x.stage])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;importMeasurements&#x27;,&#x27;Importar medições aprovadas&#x27;)+api.jumpAdmin(&#x27;obras&#x27;,&#x27;Ver fiscalização&#x27;)+&#x27;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;A fila recebe somente medições aprovadas. Importar não liquida nem paga a despesa.&lt;/p&gt;&lt;/div&gt;&#x27;;
    h+=&#x27;&lt;div class=&quot;fc-flow-card el-mt&quot;&gt;&lt;label class=&quot;el-field&quot;&gt;Parcela em análise&lt;select data-mx-change=&quot;finance:selected&quot;&gt;&#x27;+[0,1].map(j=&gt;&#x27;&lt;option value=&quot;&#x27;+j+&#x27;&quot; &#x27;+(i===j?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;Medição &#x27;+(j+1)+&#x27; · R$ 60.000&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&#x27;;
    if(!contract(api))return h+&#x27;&lt;div class=&quot;fc-status&quot;&gt;Conclua a contratação para gerar os recebíveis.&lt;/div&gt;&lt;/div&gt;&#x27;;
    if(!approved(api,i))return h+&#x27;&lt;div class=&quot;fc-status&quot;&gt;A fiscalização ainda não aprovou esta medição. Nenhuma liquidação está disponível.&lt;/div&gt;&lt;/div&gt;&#x27;;
    if(!p.queued)return h+&#x27;&lt;div class=&quot;fc-status&quot;&gt;Medição aprovada na origem. Importe-a para a fila financeira.&lt;/div&gt;&lt;/div&gt;&#x27;;
    h+=&#x27;&lt;div class=&quot;fc-row el-mt&quot;&gt;&lt;h3&gt;NF-DEMO-OB-0&#x27;+(i+1)+&#x27;&lt;/h3&gt;&lt;span class=&quot;el-pill&quot;&gt;&#x27;+labels[p.stage]+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fc-stepper&quot;&gt;&#x27;+[&#x27;Documento&#x27;,&#x27;Liquidação&#x27;,&#x27;Autorização&#x27;,&#x27;Programação&#x27;,&#x27;Pagamento&#x27;].map((x,j)=&gt;&#x27;&lt;span class=&quot;&#x27;+(j&lt;p.stage-1?&#x27;passed&#x27;:j===p.stage-1?&#x27;current&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+x+&#x27;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===0)h+=&#x27;&lt;p class=&quot;fc-note&quot;&gt;Aguardando documento fiscal da contratada.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.jumpPortal(&#x27;financeiro&#x27;,&#x27;Abrir recebíveis no portal&#x27;)+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===1)h+=check(api,&#x27;checked&#x27;,&#x27;Conferir documento fiscal, medição aprovada, credor e retenções aplicáveis no exemplo&#x27;,p.checked)+&#x27;&lt;p class=&quot;fc-note&quot;&gt;Exemplo simplificado: retenções R$ 0. Valor bruto e líquido: R$ 60.000. A produção exige as regras fiscais do contrato.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;liquidate&#x27;,&#x27;Registrar liquidação da parcela&#x27;,{primary:true,disabled:f.role!==&#x27;Contabilidade&#x27;||!p.checked||f.committed&lt;amount})+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===2)h+=&#x27;&lt;p class=&quot;fc-note&quot;&gt;Liquidação DEMO-LIQ-0&#x27;+(i+1)+&#x27; registrada · posição cronológica de exemplo &#x27;+p.order+&#x27;.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;authorize&#x27;,&#x27;Autorizar pagamento da parcela&#x27;,{primary:true,disabled:f.role!==&#x27;Ordenador de despesa&#x27;})+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===3)h+=&#x27;&lt;label class=&quot;el-field&quot;&gt;Fonte proposta para programação&lt;select data-mx-change=&quot;finance:source&quot;&gt;&#x27;+Object.entries(funds).map(([k,v])=&gt;&#x27;&lt;option value=&quot;&#x27;+k+&#x27;&quot; &#x27;+(p.source===k?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+v+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;p class=&quot;fc-note&quot;&gt;Fonte do empenho: convênio da praça. Disponível após outras programações: &#x27;+api.money(m.available.convenio)+&#x27;.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;schedule&#x27;,&#x27;Programar para o próximo lote de exemplo&#x27;,{primary:true,disabled:f.role!==&#x27;Tesouraria&#x27;})+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===4)h+=&#x27;&lt;div class=&quot;fc-status&quot;&gt;R$ 60.000 separados para esta parcela. Saldo bancário ainda não foi debitado.&lt;/div&gt;&lt;label class=&quot;el-field el-mt&quot;&gt;Retorno bancário da ordem&lt;select data-mx-change=&quot;finance:bank&quot;&gt;&#x27;+[[&#x27;correto&#x27;,&#x27;Referência, fonte e valor corretos&#x27;],[&#x27;divergente&#x27;,&#x27;Valor divergente · R$ 61.000&#x27;],[&#x27;rejeitado&#x27;,&#x27;Ordem rejeitada pelo banco&#x27;]].map(([k,v])=&gt;&#x27;&lt;option value=&quot;&#x27;+k+&#x27;&quot; &#x27;+(p.bank===k?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+v+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&#x27;+(!f.autoMatch?check(api,&#x27;manual&#x27;,&#x27;Conferir manualmente o retorno de pagamento&#x27;,p.manual):&#x27;&#x27;)+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;confirm&#x27;,&#x27;Simular retorno e conciliar pagamento&#x27;,{primary:true,disabled:f.role!==&#x27;Tesouraria&#x27;||(!f.autoMatch&amp;&amp;!p.manual)})+&#x27;&lt;/div&gt;&#x27;;
    if(p.error)h+=&#x27;&lt;div class=&quot;fc-status&quot;&gt;&#x27;+(p.error===&#x27;valor&#x27;?&#x27;Retorno divergente: nenhum débito de caixa ou baixa de pagamento.&#x27;:&#x27;Ordem rejeitada: pagamento permanece pendente. Corrija o retorno de exemplo para tentar novamente.&#x27;)+&#x27;&lt;/div&gt;&#x27;;
    if(p.stage===5)h+=&#x27;&lt;div class=&quot;fc-status&quot;&gt;Pagamento DEMO-PAG-0&#x27;+(i+1)+&#x27; conciliado. R$ 60.000 debitados uma única vez da fonte da praça.&lt;/div&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;confirm&#x27;,&#x27;Testar retorno repetido&#x27;)+&#x27;&lt;/div&gt;&#x27;;
    return h+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.jumpPortal(&#x27;financeiro&#x27;,&#x27;Ver situação da contratada&#x27;)+jump(api,&#x27;caixa&#x27;,&#x27;Conferir saldo por fonte&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;O exemplo aplica ordem cronológica por liquidação dentro da mesma fonte e categoria, sem exceções. Em produção, exceções exigem fundamento e registro próprios.&lt;/p&gt;&#x27;;
  }
  function rules(api){const f=api.state;return &#x27;&lt;div class=&quot;fc-flow-card&quot;&gt;&lt;h3&gt;Regras configuráveis&lt;/h3&gt;&#x27;+[[&#x27;autoRevenue&#x27;,&#x27;Integrar receitas após conciliação tributária&#x27;,&#x27;Desligada: a Tesouraria importa os retornos confirmados; a origem continua rastreável.&#x27;],[&#x27;autoQueue&#x27;,&#x27;Criar recebível após aprovação da medição&#x27;,&#x27;Desligada: use a importação manual. Documento fiscal e decisões financeiras permanecem separados.&#x27;],[&#x27;autoMatch&#x27;,&#x27;Conferir retornos bancários por regra&#x27;,&#x27;Desligada: exige conferência manual. Valores divergentes, fonte indevida e duplicações continuam bloqueados.&#x27;],[&#x27;alerts&#x27;,&#x27;Comunicar etapas à contratada&#x27;,&#x27;Mensagens no portal quando houver avanço financeiro. Nenhuma mensagem externa é enviada.&#x27;]].map(([k,t,n])=&gt;&#x27;&lt;div class=&quot;fc-rule&quot;&gt;&#x27;+check(api,k,t,f[k])+&#x27;&lt;p&gt;&#x27;+n+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;forecast&#x27;,&#x27;Executar verificação de caixa&#x27;)+&#x27;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;Liquidação, autorização e programação dependem dos responsáveis. Nenhuma regra transforma uma previsão em dinheiro disponível.&lt;/p&gt;&lt;/div&gt;&#x27;;}
  function publicSummary(api){const f=api.state,m=totals(api);return &#x27;&lt;div class=&quot;fc-intro&quot;&gt;&lt;div class=&quot;el-kicker&quot;&gt;Transparência · recorte financeiro&lt;/div&gt;&lt;h2&gt;Da arrecadação à entrega pública.&lt;/h2&gt;&lt;p&gt;Valores fictícios, atualizados pelos registros desta demonstração.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fc-grid&quot;&gt;&#x27;+metric(api,&#x27;Receita tributária integrada&#x27;,m.postedIncome,&#x27;Total agregado do exemplo.&#x27;)+metric(api,&#x27;Obra · liquidado&#x27;,m.liquidated,&#x27;Parcelas conferidas pela Contabilidade.&#x27;)+metric(api,&#x27;Obra · pago&#x27;,m.workPaid,&#x27;Pagamentos conciliados.&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;fc-flow-card el-mt&quot;&gt;&lt;h3&gt;Praça · execução orçamentária e financeira&lt;/h3&gt;&lt;div class=&quot;ep-ledger&quot;&gt;&#x27;+[[&#x27;Dotação atualizada&#x27;,m.dotation],[&#x27;Empenhado no contrato&#x27;,f.committed],[&#x27;Medições aprovadas e publicadas&#x27;,(api.other(&#x27;works&#x27;)?.publishedCount||0)*60000],[&#x27;Liquidado&#x27;,m.liquidated],[&#x27;Pago&#x27;,m.workPaid]].map(([a,b])=&gt;&#x27;&lt;div&gt;&lt;span&gt;&#x27;+a+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+api.money(b)+&#x27;&lt;/strong&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;p class=&quot;fc-note&quot;&gt;Fonte: eventos locais da demonstração. O saldo interno de cada contribuinte permanece na área autenticada. Este recorte não é um relatório fiscal oficial.&lt;/p&gt;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.jumpPortal(&#x27;publico&#x27;,&#x27;Ver evolução física da obra&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}
  function portal(api){const f=api.state;let h=publicSummary(api)+&#x27;&lt;div class=&quot;fc-flow-card el-mt&quot;&gt;&lt;h3&gt;Recebíveis da contratada · Empresa Alfa&lt;/h3&gt;&lt;p class=&quot;fc-note&quot;&gt;Contrato DEMO-CT-OB-004 · acesso restrito ao representante autorizado.&lt;/p&gt;&#x27;;const g=api.gate(true);if(g)return h+g+&#x27;&lt;/div&gt;&#x27;;
    if(!contract(api))return h+&#x27;&lt;div class=&quot;fc-status&quot;&gt;Aguardando formalização do contrato da obra.&lt;/div&gt;&lt;/div&gt;&#x27;;
    h+=f.items.map((p,i)=&gt;&#x27;&lt;div class=&quot;el-detail-row&quot;&gt;&lt;div class=&quot;fc-row&quot;&gt;&lt;strong&gt;Medição &#x27;+(i+1)+&#x27; · R$ 60.000&lt;/strong&gt;&lt;span class=&quot;el-pill&quot;&gt;&#x27;+(!approved(api,i)?&#x27;Aguardando aprovação&#x27;:!p.queued?&#x27;Aguardando integração&#x27;:labels[p.stage])+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+(approved(api,i)&amp;&amp;p.queued&amp;&amp;p.stage===0?check(api,&#x27;document&#x27;+i,&#x27;Vincular NF demonstrativa à medição aprovada&#x27;,p.document)+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+api.button(&#x27;submit&#x27;+i,&#x27;Enviar documento fiscal de exemplo&#x27;,{primary:true,disabled:!p.document})+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+(p.stage===4?&#x27;&lt;p&gt;Pagamento programado. A confirmação bancária ainda está pendente.&lt;/p&gt;&#x27;:&#x27;&#x27;)+(p.stage===5?&#x27;&lt;p&gt;Comprovante DEMO-PAG-0&#x27;+(i+1)+&#x27; · pagamento conciliado de R$ 60.000. Sem efeito financeiro real.&lt;/p&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;);
    return h+&#x27;&lt;div class=&quot;fc-actions&quot;&gt;&#x27;+jump(api,&#x27;pagamentos&#x27;,&#x27;Ver tratamento na prefeitura&#x27;)+api.jumpPortal(&#x27;mensagens&#x27;,&#x27;Ver mensagens do contrato&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}
  function importRevenue(api,automatic=false){const f=api.state,t=api.other(&#x27;taxes&#x27;);let count=0;for(const [id,v]of [[&#x27;iptu&#x27;,1200],[&#x27;iss&#x27;,800]])if(t?.cases?.[id]?.stage===5&amp;&amp;!f.receipts[id]){f.receipts[id]=true;count++;api.log(automatic?&#x27;Regra de integração de receitas&#x27;:&#x27;Tesouraria&#x27;,&#x27;RET-&#x27;+(id===&#x27;iptu&#x27;?&#x27;DEMO-IPTU-021&#x27;:&#x27;DEMO-ISS-032&#x27;)+&#x27; integrado uma vez ao caixa municipal: &#x27;+api.money(v)+&#x27;.&#x27;);}return count;}
  function importMeasurements(api,automatic=false){let n=0;for(let i=0;i&lt;2;i++)if(approved(api,i)&amp;&amp;!api.state.items[i].queued){api.state.items[i].queued=true;n++;api.log(automatic?&#x27;Regra de recebíveis&#x27;:&#x27;Contabilidade&#x27;,&#x27;Medição &#x27;+(i+1)+&#x27; aprovada importada; documento fiscal pendente.&#x27;);notify(api,&#x27;medição &#x27;+(i+1)+&#x27; disponível para anexar o documento fiscal.&#x27;);}return n;}
  function earlier(api,i,paidOnly=false){const p=api.state.items[i];return api.state.items.some((x,j)=&gt;j!==i&amp;&amp;x.order&gt;0&amp;&amp;x.order&lt;p.order&amp;&amp;x.stage&gt;=2&amp;&amp;x.stage&lt;(paidOnly?5:4));}
  function forecast(api){const f=api.state,m=totals(api);f.flowAlert=m.liquidated-m.workPaid-m.held&gt;m.available.convenio;return f.flowAlert;}
  const actions={
    reserve(api){const f=api.state;if(!hasRole(api,&#x27;Planejamento&#x27;))return;if(f.reservation||f.committed)return api.feedback(&#x27;Reserva ou empenho já registrados. Sem duplicação.&#x27;);if(!f.budgetChecked)return api.feedback(&#x27;Conclua a conferência orçamentária.&#x27;);if(totals(api).budgetFree&lt;252000)return api.feedback(&#x27;Dotação insuficiente para a reserva.&#x27;);f.reservation=252000;api.other(&#x27;procurement&#x27;).budget=true;api.log(&#x27;Planejamento&#x27;,&#x27;Reserva DEMO-RES-004 de R$ 252.000 vinculada à licitação. Nenhum movimento de caixa.&#x27;);},
    credit(api){const f=api.state;if(!hasRole(api,&#x27;Planejamento&#x27;))return;if(!f.creditChecked||f.credit)return api.feedback(&#x27;Confira a autorização; um crédito registrado não é aplicado novamente.&#x27;);f.credit=50000;api.log(&#x27;Planejamento&#x27;,&#x27;Crédito autorizado DEMO-ORC-005 de R$ 50.000 registrado por anulação de outra dotação de exemplo. Caixa preservado.&#x27;);},
    commit(api){const f=api.state,c=contract(api);if(!hasRole(api,&#x27;Contabilidade&#x27;))return;if(f.committed)return api.feedback(&#x27;Empenho já registrado. Saldo preservado.&#x27;);if(!c||f.reservation&lt;c.value)return api.feedback(&#x27;Contrato e reserva suficientes são necessários.&#x27;);f.committed=c.value;f.reservation=0;api.other(&#x27;procurement&#x27;).budget=true;api.log(&#x27;Contabilidade&#x27;,&#x27;Empenho DEMO-EMP-004 de R$ 240.000 registrado; R$ 12.000 liberados da reserva. Nenhum débito bancário.&#x27;);notify(api,&#x27;empenho registrado; execução depende da ordem de início.&#x27;);},
    importRevenue(api){if(!hasRole(api,&#x27;Tesouraria&#x27;))return;const n=importRevenue(api);api.feedback(n?n+&#x27; receita(s) integrada(s) ao caixa do exemplo.&#x27;:&#x27;Nenhuma receita conciliada pendente. Sem duplicação.&#x27;);},
    checkRevenue(api){api.feedback(totals(api).pendingIncome?&#x27;Há retorno pendente: use a integração pela Tesouraria. Esta conferência não altera o caixa.&#x27;:&#x27;Retornos já registrados ignorados. Nenhuma nova entrada.&#x27;);},
    importMeasurements(api){if(!hasRole(api,&#x27;Contabilidade&#x27;))return;const n=importMeasurements(api);api.feedback(n?n+&#x27; medição(ões) importada(s).&#x27;:&#x27;Nenhuma medição aprovada pendente de importação.&#x27;);},
    receiveGrant(api){const f=api.state;if(!hasRole(api,&#x27;Tesouraria&#x27;))return;if(f.grant)return api.feedback(&#x27;RET-DEMO-CONV-004 já conciliado. Entrada não duplicada.&#x27;);if(f.grantBank!==&#x27;correto&#x27;)return api.feedback(&#x27;Referência divergente. Crédito de convênio não registrado.&#x27;);if(!f.autoMatch&amp;&amp;!f.grantManual)return api.feedback(&#x27;Confira o retorno do crédito.&#x27;);f.grant=true;api.log(&#x27;Tesouraria&#x27;,&#x27;RET-DEMO-CONV-004 conciliado: R$ 50.000 de entrada na fonte exclusiva da praça.&#x27;);forecast(api);},
    liquidate(api){const f=api.state,p=f.items[f.selected];if(!hasRole(api,&#x27;Contabilidade&#x27;))return;if(!approved(api,f.selected)||!p.queued||p.stage!==1||!p.checked||f.committed&lt;totals(api).liquidated+amount)return api.feedback(&#x27;Medição aprovada, documento conferido e saldo de empenho são necessários.&#x27;);p.stage=2;p.order=++f.counter;api.log(&#x27;Contabilidade&#x27;,&#x27;DEMO-LIQ-0&#x27;+(f.selected+1)+&#x27;: R$ 60.000 liquidados; posição de exemplo &#x27;+p.order+&#x27;.&#x27;);notify(api,&#x27;parcela &#x27;+(f.selected+1)+&#x27; liquidada, aguardando autorização.&#x27;);forecast(api);},
    authorize(api){const f=api.state,p=f.items[f.selected];if(!hasRole(api,&#x27;Ordenador de despesa&#x27;))return;if(p.stage!==2)return;p.stage=3;api.log(&#x27;Ordenador de despesa&#x27;,&#x27;Parcela &#x27;+(f.selected+1)+&#x27; autorizada para programação; sem pagamento confirmado.&#x27;);notify(api,&#x27;parcela &#x27;+(f.selected+1)+&#x27; autorizada, ainda sem pagamento.&#x27;);},
    schedule(api){const f=api.state,p=f.items[f.selected];if(!hasRole(api,&#x27;Tesouraria&#x27;))return;if(p.stage!==3)return;if(p.source!==&#x27;convenio&#x27;)return api.feedback(&#x27;Fonte incompatível com o empenho da praça. Use o convênio vinculado; saldo de outra fonte não autoriza esta despesa.&#x27;);if(earlier(api,f.selected))return api.feedback(&#x27;Há parcela anterior da mesma fonte e categoria ainda não programada. Respeite a fila do exemplo.&#x27;);if(totals(api).available.convenio&lt;amount){f.flowAlert=true;return api.feedback(&#x27;Caixa insuficiente na fonte da praça. Entrada prevista não é saldo disponível.&#x27;);}p.stage=4;api.log(&#x27;Tesouraria&#x27;,&#x27;Parcela &#x27;+(f.selected+1)+&#x27; programada: R$ 60.000 separados na fonte da praça. Saldo bancário ainda preservado.&#x27;);notify(api,&#x27;parcela &#x27;+(f.selected+1)+&#x27; programada; aguardando retorno bancário.&#x27;);forecast(api);},
    confirm(api){const f=api.state,p=f.items[f.selected];if(!hasRole(api,&#x27;Tesouraria&#x27;))return;if(p.stage===5)return api.feedback(&#x27;Retorno já conciliado. Nenhum novo débito de caixa ou aviso.&#x27;);if(p.stage!==4)return api.feedback(&#x27;A parcela precisa estar programada.&#x27;);if(!f.autoMatch&amp;&amp;!p.manual)return api.feedback(&#x27;Conferência manual do retorno pendente.&#x27;);if(earlier(api,f.selected,true))return api.feedback(&#x27;Concilie a parcela anterior da fila antes desta.&#x27;);if(p.bank!==&#x27;correto&#x27;){p.error=p.bank===&#x27;divergente&#x27;?&#x27;valor&#x27;:&#x27;rejeitado&#x27;;api.log(&#x27;Tesouraria&#x27;,&#x27;Retorno da parcela &#x27;+(f.selected+1)+&#x27; bloqueado: &#x27;+p.bank+&#x27;. Caixa e pagamento preservados.&#x27;);return api.feedback(&#x27;Retorno não conciliado. A parcela permanece programada.&#x27;);}if(p.source!==&#x27;convenio&#x27;||totals(api).balances.convenio&lt;amount)return api.feedback(&#x27;Fonte ou saldo incompatível. Não houve pagamento.&#x27;);p.stage=5;p.error=&#x27;&#x27;;api.log(&#x27;Tesouraria&#x27;,&#x27;DEMO-PAG-0&#x27;+(f.selected+1)+&#x27; conciliado: saída única de R$ 60.000 da fonte da praça.&#x27;);notify(api,&#x27;pagamento da parcela &#x27;+(f.selected+1)+&#x27; confirmado no exemplo. Comprovante disponível.&#x27;);forecast(api);},
    forecast(api){api.feedback(forecast(api)?&#x27;Alerta: falta cobertura de caixa para parte das parcelas liquidadas.&#x27;:&#x27;O caixa do exemplo cobre as parcelas liquidadas ainda não programadas.&#x27;);}
  };
  for(const id of Object.keys(tabs))actions[&#x27;tab_&#x27;+id]=api=&gt;{api.state.tab=id;};
  for(let i=0;i&lt;2;i++)actions[&#x27;submit&#x27;+i]=api=&gt;{const p=api.state.items[i];if(!api.authorized(true)||!approved(api,i)||!p.queued||p.stage!==0||!p.document)return api.feedback(&#x27;Identificação, representação, medição e documento são necessários.&#x27;);p.stage=1;api.log(&#x27;Representante da Empresa Alfa&#x27;,&#x27;NF-DEMO-OB-0&#x27;+(i+1)+&#x27; vinculada à medição aprovada.&#x27;);notify(api,&#x27;documento fiscal da parcela &#x27;+(i+1)+&#x27; recebido para análise.&#x27;);};
  return {id:&#x27;finance&#x27;,seed,normalize,totals,
    admin(api){const pages={resumo:overview,orcamento:budget,caixa:cash,arrecadacao:revenue,pagamentos:payments,regras:rules};return head(api)+pages[api.state.tab](api)+api.history();},portal,
    summary(api){const m=totals(api);return {title:&#x27;Financeiro integrado&#x27;,status:api.money(m.workPaid)+&#x27; pagos na obra · &#x27;+api.money(m.postedIncome)+&#x27; arrecadados nos tributos&#x27;};},
    onEvent(api,origin,action){if(origin===&#x27;taxes&#x27;&amp;&amp;action===&#x27;reconcile&#x27;&amp;&amp;api.state.autoRevenue)importRevenue(api,true);if(origin===&#x27;works&#x27;&amp;&amp;action===&#x27;approve&#x27;&amp;&amp;api.state.autoQueue)importMeasurements(api,true);forecast(api);},
    actions,
    change(api,key,value){const f=api.state,p=f.items[f.selected];if(key===&#x27;role&#x27;&amp;&amp;roles.includes(value)){f.role=value;return;}if(key===&#x27;selected&#x27;){f.selected=value===&#x27;1&#x27;?1:0;return;}if([&#x27;autoRevenue&#x27;,&#x27;autoQueue&#x27;,&#x27;autoMatch&#x27;,&#x27;alerts&#x27;,&#x27;budgetChecked&#x27;,&#x27;creditChecked&#x27;].includes(key)){f[key]=value===true;return;}if(key===&#x27;grantBank&#x27;&amp;&amp;[&#x27;correto&#x27;,&#x27;divergente&#x27;].includes(value)&amp;&amp;!f.grant){f.grantBank=value;f.grantManual=false;return;}if(key===&#x27;grantManual&#x27;&amp;&amp;!f.grant){f.grantManual=value===true;return;}if(/^document[01]$/.test(key)){const i=Number(key.slice(-1));if(api.authorized(true)&amp;&amp;approved(api,i)&amp;&amp;f.items[i].queued&amp;&amp;f.items[i].stage===0)f.items[i].document=value===true;return;}if(key===&#x27;checked&#x27;&amp;&amp;p.stage===1)p.checked=value===true;if(key===&#x27;source&#x27;&amp;&amp;p.stage===3&amp;&amp;Object.hasOwn(funds,value))p.source=value;if(key===&#x27;bank&#x27;&amp;&amp;p.stage===4&amp;&amp;[&#x27;correto&#x27;,&#x27;divergente&#x27;,&#x27;rejeitado&#x27;].includes(value)){p.bank=value;p.manual=false;p.error=&#x27;&#x27;;}if(key===&#x27;manual&#x27;&amp;&amp;p.stage===4)p.manual=value===true;}
  };
})());

      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
